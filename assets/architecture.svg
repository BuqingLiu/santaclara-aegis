<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13294B"/><stop offset="1" stop-color="#0B1F3A"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34E0E8"/><stop offset="1" stop-color="#2C7BE5"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5B7AA8"/>
    </marker>
  </defs>
  <rect width="760" height="300" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0B1F3A">SantaClara Aegis — System Architecture</text>

  <!-- Stage 1 -->
  <rect x="20" y="70" width="140" height="80" rx="10" fill="url(#box)" stroke="#1E3A66"/>
  <text x="90" y="102" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">Client ODD</text>
  <text x="90" y="120" text-anchor="middle" font-size="11" fill="#9FB6D6">Map · Weather ·</text>
  <text x="90" y="135" text-anchor="middle" font-size="11" fill="#9FB6D6">Vehicle profile</text>

  <!-- Stage 2 -->
  <rect x="200" y="70" width="150" height="80" rx="10" fill="url(#box)" stroke="#1E3A66"/>
  <text x="275" y="102" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">Scenario Engine</text>
  <text x="275" y="120" text-anchor="middle" font-size="11" fill="#9FB6D6">elite™ core</text>
  <text x="275" y="135" text-anchor="middle" font-size="10.5" fill="#34E0E8">proprietary · subscriber-only</text>

  <!-- Stage 3 -->
  <rect x="390" y="70" width="140" height="80" rx="10" fill="url(#box)" stroke="#1E3A66"/>
  <text x="460" y="102" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">CARLA Sim</text>
  <text x="460" y="120" text-anchor="middle" font-size="11" fill="#9FB6D6">Deterministic</text>
  <text x="460" y="135" text-anchor="middle" font-size="11" fill="#9FB6D6">20 Hz sync</text>

  <!-- Stage 4 -->
  <rect x="570" y="70" width="170" height="80" rx="10" fill="url(#box)" stroke="#1E3A66"/>
  <text x="655" y="102" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">Capture &amp; Score</text>
  <text x="655" y="120" text-anchor="middle" font-size="11" fill="#9FB6D6">Telemetry · Radar</text>
  <text x="655" y="135" text-anchor="middle" font-size="11" fill="#9FB6D6">Ground truth</text>

  <!-- arrows -->
  <line x1="160" y1="110" x2="196" y2="110" stroke="#5B7AA8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="350" y1="110" x2="386" y2="110" stroke="#5BAA8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="110" x2="566" y2="110" stroke="#5B7AA8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Output block -->
  <rect x="200" y="200" width="540" height="78" rx="10" fill="#F4F7FB" stroke="#C9D6E8"/>
  <text x="220" y="224" font-size="12" font-weight="700" fill="#0B1F3A">Per-scenario dataset + compliance package</text>
  <text x="220" y="246" font-size="11" fill="#3A4A63">telemetry.csv · events.json · frames/*.png · summary.json  →  DMV-style compliance report (PDF/MD)</text>
  <text x="220" y="266" font-size="11" fill="#3A4A63">Delivered via subscription API or managed service.</text>
  <line x1="655" y1="150" x2="655" y2="196" stroke="#5B7AA8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="196" x2="470" y2="200" stroke="#5B7AA8" stroke-width="2"/>
</svg>
